name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'   # roda todo dia à meia-noite (UTC)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Gerar card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=koayragomes&show_icons=true&theme=dark&hide_border=true&bg_color=1A0015&title_color=FF69B4&icon_color=FF69B4&text_color=FFD6F2
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=koayragomes&layout=compact&theme=dark&hide_border=true&bg_color=1A0015&title_color=FF69B4&text_color=FFD6F2
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de streak
        uses: be-next/github-streak-stats-action@v1
        with:
          username: koayragomes
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/streak.svg
          theme: dark
          hide-border: true

      - name: Commitar e enviar as imagens atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualizar estatísticas do GitHub" || echo "Nada para commitar"
          git push
